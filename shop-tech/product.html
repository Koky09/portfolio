<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Товар — Модуль</title>
<meta name="description" content="Карточка товара: характеристики, цвета, рассрочка, доставка. Демо-сайт для портфолио.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@600;700;800&family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="style.css">
<style>
  .crumbs{font-size:14px;color:var(--muted);padding-top:18px}
  .crumbs a{text-decoration:none}
  .pdp{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;padding-block:14px 30px;align-items:start}
  @media (max-width:960px){.pdp{grid-template-columns:1fr}}
  .ph{background:var(--white);border-radius:28px;overflow:hidden;aspect-ratio:1;position:relative}
  .ph img{width:100%;height:100%;object-fit:cover;transition:filter .3s}
  .panel{background:var(--white);border-radius:28px;padding:clamp(18px,3vw,30px);display:grid;gap:16px}
  .panel h1{font-size:clamp(30px,3.4vw,46px)}
  .price{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .price b{font-family:var(--display);font-size:42px}
  .price s{color:var(--muted)}
  .price .d{background:var(--orange);color:var(--white);border-radius:8px;padding:2px 8px;font-weight:700;font-size:14px}
  .colors{display:flex;gap:8px}
  .colors button{width:36px;height:36px;border-radius:50%;border:3px solid var(--white);box-shadow:0 0 0 1.5px var(--line)}
  .colors button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
  .inst{background:var(--soft);border-radius:18px;padding:14px 16px;display:grid;gap:10px}
  .terms{display:flex;gap:6px}
  .terms button{flex:1;border:1.5px solid var(--line);background:var(--white);border-radius:10px;height:40px;font-weight:700}
  .terms button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--white)}
  .inst b{font-family:var(--display);font-size:26px}
  .deliv{display:grid;gap:8px;font-size:15px}
  .deliv div{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dashed var(--line);padding-bottom:8px}
  .deliv b{color:var(--green)}
  .acts{display:flex;gap:8px;flex-wrap:wrap}
  .acts .btn{flex:1;min-width:160px}
  .specs{background:var(--white);border-radius:28px;padding:clamp(18px,3vw,30px)}
  .specs h2{font-size:30px;margin-bottom:12px}
  .specs dl{margin:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);max-width:760px}
  .specs dt,.specs dd{padding:12px 0;border-bottom:1px solid var(--line);margin:0}
  .specs dt{color:var(--ink-2)}
  .specs dd{font-weight:500}
</style>
</head>
<body>
<div id="header"></div>
<main class="wrap" id="main"></main>
<section style="padding-top:20px"><div class="wrap"><div class="head"><h2>Из той же категории</h2></div><div class="grid" id="more"></div></div></section>
<div id="footer"></div>
<script src="app.js"></script>
<script>
const COLORS = {"чёрный":["#16181D","none"],"графит":["#5D636E","grayscale(1) brightness(1.15)"],"песочный":["#D9C7A8","sepia(.6) saturate(1.3) brightness(1.1)"]};
let st = {color:"чёрный", term:12};
function render(){
  const id = location.hash.slice(1) || PRODUCTS[0].id;
  const p = PRODUCTS.find(x=>x.id===id) || PRODUCTS[0];
  document.title = `${p.name} — Модуль`;
  const inCmp = cmp.includes(p.id);
  const now = new Date(), before = now.getHours() < 16;
  document.getElementById("main").innerHTML = `
    <div class="crumbs"><a href="index.html#catalog">Каталог</a> / <a href="index.html?cat=${p.cat}#catalog">${CATS[p.cat]}</a> / ${p.name}</div>
    <div class="pdp">
      <div class="ph"><img src="${p.img}" alt="${p.name}" style="filter:${COLORS[st.color][1]}"></div>
      <div class="panel">
        <span class="rating"><b>★</b> ${String(p.rate).replace(".",",")} · ${p.rev} отзывов · артикул ${p.id.toUpperCase()}-${String(p.price).slice(0,3)}</span>
        <h1>${p.name}</h1>
        <div class="price"><b>${rub(p.price)}</b>${p.old?`<s>${rub(p.old)}</s><span class="d">−${Math.round((1-p.price/p.old)*100)}%</span>`:""}</div>
        <div><div style="font-weight:700;margin-bottom:8px">Цвет: ${st.color}</div><div class="colors" id="colors">${Object.entries(COLORS).map(([n,[c]])=>`<button data-c="${n}" style="background:${c}" aria-pressed="${st.color===n}" aria-label="${n}"></button>`).join("")}</div></div>
        <div class="inst"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px"><span>Рассрочка 0%, без переплаты</span><b>${rub(Math.ceil(p.price/st.term))} / мес.</b></div>
          <div class="terms" id="terms">${[6,12,24].map(t=>`<button data-t="${t}" aria-pressed="${st.term===t}">${t} мес.</button>`).join("")}</div></div>
        <div class="deliv">
          <div><span>Курьер</span><b>${before?"сегодня, 18:00–22:00":"завтра, с 10:00"}</b></div>
          <div><span>Самовывоз из шоурума</span><b>${before?"через 1 час":"завтра с 10:00"}</b></div>
          <div><span>Пункт выдачи СДЭК</span><span>1–3 дня, 290 ₽</span></div>
        </div>
        <div class="acts"><button class="btn" id="buy">В корзину</button><button class="btn ghost" id="cmpBtn">${inCmp?"✓ В сравнении":"⇄ Сравнить"}</button></div>
      </div>
    </div>
    <div class="specs"><h2>Характеристики</h2><dl>${SPECS[p.cat].map(([n,k])=>`<dt>${n}</dt><dd>${typeof p.s[k]==="number"?p.s[k].toLocaleString("ru-RU"):p.s[k]}</dd>`).join("")}<dt>Гарантия</dt><dd>2 года</dd></dl></div>`;
  document.getElementById("colors").onclick = e=>{ const b = e.target.closest("[data-c]"); if(b){ st.color = b.dataset.c; render(); } };
  document.getElementById("terms").onclick = e=>{ const b = e.target.closest("[data-t]"); if(b){ st.term = +b.dataset.t; render(); } };
  document.getElementById("buy").onclick = ()=>{ addToCart(p.id, st.color); openCart(); };
  document.getElementById("cmpBtn").onclick = ()=>{ toggleCmp(p.id); render(); };
  document.getElementById("more").innerHTML = PRODUCTS.filter(x=>x.cat===p.cat&&x.id!==p.id).concat(PRODUCTS.filter(x=>x.cat!==p.cat)).slice(0,4).map(card).join("");
}
window.addEventListener("hashchange", ()=>{ st = {color:"чёрный", term:12}; render(); scrollTo(0,0); });
render();
</script>
</body>
</html>
