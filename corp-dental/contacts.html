<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Контакты — Эмаль</title>
<meta name="description" content="Адрес, часы работы и запись в стоматологию «Эмаль». Демо-сайт для портфолио.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Source+Sans+3:wght@400;600;700&display=swap">
<link rel="stylesheet" href="style.css">
<style>
  .grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(24px,4vw,48px)}
  @media (max-width:900px){.grid{grid-template-columns:1fr}}
  .card{background:var(--white);border-radius:var(--r);padding:clamp(20px,3vw,36px)}
  .info{display:grid;gap:14px}
  .info img{border-radius:var(--r);width:100%;aspect-ratio:16/10;object-fit:cover}
  .hours{display:grid;grid-template-columns:1fr auto;gap:8px 20px;font-size:17px}
  .hours .today{font-weight:700;color:var(--teal)}
  dl{margin:0;display:grid;gap:14px}
  dt{font-size:14px;color:var(--muted)}
  dd{margin:2px 0 0;font-size:19px;font-weight:600}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media (max-width:520px){.row2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="header"></div>
<main>
  <div class="page-head"><div class="wrap"><div class="box">
    <div class="crumbs"><a href="index.html">Клиника</a> / Контакты</div>
    <h1>Контакты</h1>
    <p>Мы в пяти минутах от метро, есть своя парковка на 8 машин. Первый этаж, без ступенек — удобно с коляской.</p>
  </div></div></div>
  <section style="padding-top:12px">
    <div class="wrap grid">
      <div class="card">
        <h2 style="font-size:32px;margin-bottom:18px">Записаться</h2>
        <form class="form" data-demo novalidate>
          <div class="row2"><label class="f" for="n">Имя<input id="n" autocomplete="name" required></label><label class="f" for="p">Телефон<input id="p" type="tel" autocomplete="tel" required></label></div>
          <label class="f" for="s">Направление<select id="s"><option>Консультация</option><option>Лечение</option><option>Гигиена</option><option>Имплантация</option><option>Коронки и виниры</option><option>Ортодонтия</option><option>Ребёнок</option></select></label>
          <label class="f" for="t">Удобное время<select id="t"><option>Утро, 8–12</option><option>День, 12–17</option><option>Вечер, 17–22</option></select></label>
          <button class="btn" type="submit">Отправить</button>
          <div class="ok" hidden></div>
        </form>
      </div>
      <div class="info">
        <img src="img/room2.jpg" alt="Кабинет клиники" loading="lazy">
        <div class="card">
          <dl>
            <dt>Адрес</dt><dd>ул. Садовая, 21, первый этаж</dd>
            <dt>Телефон</dt><dd style="user-select:all">+7 900 222-33-44</dd>
          </dl>
          <h3 style="font-size:20px;margin:20px 0 10px">Часы работы</h3>
          <div class="hours" id="hours"></div>
        </div>
      </div>
    </div>
  </section>
</main>
<div id="footer"></div>
<script src="app.js"></script>
<script>
const DAYS = ["Понедельник","Вторник","Среда","Четверг","Пятница","Суббота","Воскресенье"];
const today = (new Date().getDay()+6)%7;
document.getElementById("hours").innerHTML = DAYS.map((d,i)=>`<span class="${i===today?"today":""}">${d}${i===today?" · сегодня":""}</span><span class="${i===today?"today":""}">${i<5?"8:00–22:00":"9:00–20:00"}</span>`).join("");
</script>
</body>
</html>
