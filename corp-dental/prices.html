<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Цены — Эмаль</title>
<meta name="description" content="Прайс-лист стоматологии «Эмаль» с поиском по услугам. Демо-сайт для портфолио.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Source+Sans+3:wght@400;600;700&display=swap">
<link rel="stylesheet" href="style.css">
<style>
  .tools{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-bottom:24px}
  .search{flex:1;min-width:240px;position:relative}
  .search input{width:100%;height:56px;border:1.5px solid var(--line);border-radius:999px;padding:0 20px 0 50px;font-size:17px;background:var(--white)}
  .search input:focus{outline:none;border-color:var(--teal)}
  .search svg{position:absolute;left:18px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--muted)}
  .cats{display:flex;gap:6px;flex-wrap:wrap}
  .cats a{text-decoration:none;border:1.5px solid var(--line);background:var(--white);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14.5px}
  .cats a:hover{border-color:var(--teal)}
  .group{background:var(--white);border-radius:var(--r);padding:8px 24px 14px;margin-bottom:14px;scroll-margin-top:96px}
  .group h2{font-size:26px;padding:16px 0 8px}
  .row{display:grid;grid-template-columns:1fr auto;gap:16px;padding:13px 0;border-top:1px solid var(--line);font-size:17px}
  .row b{font-variant-numeric:tabular-nums;white-space:nowrap}
  mark{background:var(--blush);border-radius:4px;padding:0 2px}
  .empty{color:var(--ink-2);padding:24px 0}
  .note{background:var(--teal-soft);border-radius:var(--r);padding:20px 24px;margin-top:24px;color:var(--ink-2)}
</style>
</head>
<body>
<div id="header"></div>
<main>
  <div class="page-head"><div class="wrap"><div class="box">
    <div class="crumbs"><a href="index.html">Клиника</a> / Цены</div>
    <h1>Цены</h1>
    <p>Цены окончательные: анестезия, одноразовые инструменты и материалы уже включены. Рассрочка 0% на 12 месяцев от 20 000 ₽.</p>
  </div></div></div>
  <section style="padding-top:12px">
    <div class="wrap">
      <div class="tools">
        <label class="search" for="q"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
          <input id="q" type="search" placeholder="Найти услугу: имплант, чистка, винир…" aria-label="Поиск по услугам"></label>
      </div>
      <nav class="cats" id="cats" aria-label="Разделы прайса" style="margin-bottom:22px"></nav>
      <div id="list"></div>
      <div class="note">Точная стоимость зависит от клинической ситуации и определяется на консультации. Вы получите письменный план лечения до начала работ.</div>
    </div>
  </section>
</main>
<div id="footer"></div>
<script src="app.js"></script>
<script>
const q = document.getElementById("q");
const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
function render(){
  const term = q.value.trim().toLowerCase();
  const re = term ? new RegExp(`(${esc(term)})`,"gi") : null;
  const groups = PRICES.map(([g,items])=>[g, items.filter(([n])=>!term || n.toLowerCase().includes(term) || g.toLowerCase().includes(term))]).filter(([,i])=>i.length);
  document.getElementById("cats").innerHTML = groups.map(([g])=>`<a href="#${g}">${g}</a>`).join("");
  document.getElementById("list").innerHTML = groups.length ? groups.map(([g,items])=>`<div class="group" id="${g}"><h2>${g}</h2>${items.map(([n,p])=>`<div class="row"><span>${re?n.replace(re,"<mark>$1</mark>"):n}</span><b>${rub(p)}</b></div>`).join("")}</div>`).join("")
    : `<p class="empty">Ничего не нашлось по запросу «${q.value}». Позвоните нам: +7 900 222-33-44 — подскажем.</p>`;
}
q.addEventListener("input", render);
render();
if(location.hash){ const el = document.getElementById(decodeURIComponent(location.hash.slice(1))); el && el.scrollIntoView(); }
</script>
</body>
</html>
